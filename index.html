<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  :root{
    --bg:#0A0B0D;
    --surface:#0F141A;
    --card:#16222B;
    --card-hover:#1E2F3D;

    --primary:#00D4FF;
    --secondary:#00A9C7;

    --text:#F4F8FB;
    --muted:#94A3B8;
    --line:#1E2F3D;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    Roboto,Helvetica,Arial,sans-serif;

    background:
      radial-gradient(circle at top right, rgba(0,212,255,.08), transparent 35%),
      var(--bg);

    color:var(--text);
    padding:6px;
  }

  .wrap{
    max-width:900px;
    margin:0 auto;
  }

  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }

  .header h1{
    font-size:15px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--primary);
    margin:0;
    font-weight:700;
  }

  .header .updated{
    font-size:11px;
    color:var(--muted);
  }


  .grid{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:8px;
    width:100%;
  }

  @media(max-width:600px){
    .grid{
      grid-template-columns:1fr;
    }
  }

  .card{
    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,.03),
        rgba(255,255,255,0)
      ),
      var(--card);

    border:1px solid var(--line);
    border-left:4px solid var(--secondary);

    border-radius:12px;
    padding:10px;

    position:relative;

    transition:
      transform .2s ease,
      border-color .2s ease,
      background .2s ease;
  }


  .card:hover{
    transform:translateY(-3px);
    background:var(--card-hover);
    border-color:rgba(0,212,255,.45);
  }


  .card.hq{
    border-left-color:var(--primary);
    box-shadow:
      0 0 18px rgba(0,212,255,.12);
  }


  .city-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }


  .city{
    font-weight:700;
    font-size:14px;
    color:#FFFFFF;
  }


  .tag{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.08em;

    color:var(--primary);
    font-weight:700;

    background:rgba(0,212,255,.12);
    padding:3px 7px;
    border-radius:20px;
  }


  .temp-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:5px;
  }


  .icon{
    font-size:24px;
    line-height:1;
  }


  .temp{
    font-size:22px;
    font-weight:700;
    color:var(--primary);
  }


  .cond{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }


  .meta{
    font-size:11px;
    color:var(--muted);
    margin-top:5px;
  }


  .commute-link{
    display:inline-block;

    margin-top:12px;

    font-size:11px;
    font-weight:600;

    color:var(--primary);

    text-decoration:none;

    border-bottom:1px solid var(--primary);

    transition:.2s ease;
  }


  .commute-link:hover{
    color:white;
    border-color:white;
  }


  .error{
    font-size:12px;
    color:#FF6B6B;
  }


  .loading{
    font-size:12px;
    color:var(--muted);
  }

</style>


</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Weather &amp; Commute</h1>
    <span class="updated" id="updated"></span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
/* =========================================================
   CONFIGURE YOUR CITIES HERE
   - label: shown on the card
   - isHQ: true for your headquarters (gets the highlighted style)
   - lat/lon: coordinates (use https://geocoding-api.open-meteo.com to look them up,
     or just search "<city> latitude longitude")
   - commuteFrom / commuteTo: addresses used to build a Google Maps directions link
     (leave commuteFrom empty to skip the commute link)
   ========================================================= */
  const CITIES = [
    { label: "Adelaide HQ",   isHQ: true,  lat: -34.9285, lon: 138.6007, commuteFrom: "", commuteTo: "Adelaide SA" },
    { label: "Sydney Branch", isHQ: false, lat: -33.8688, lon: 151.2093, commuteFrom: "", commuteTo: "Sydney NSW" },
    { label: "Melbourne Branch", isHQ: false, lat: -37.8136, lon: 144.9631, commuteFrom: "", commuteTo: "Melbourne VIC" }
  ];

  // WMO weather codes -> icon + label
  const WCODE = {
    0:["☀️","Clear sky"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
    45:["🌫️","Fog"],48:["🌫️","Fog"],
    51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Dense drizzle"],
    61:["🌧️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],
    71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],
    80:["🌦️","Rain showers"],81:["🌧️","Rain showers"],82:["⛈️","Violent showers"],
    95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm w/ hail"],99:["⛈️","Severe storm"]
  };

  async function loadCity(city){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("weather fetch failed");
    const data = await res.json();
    return data.current;
  }

  function commuteUrl(city){
    if(!city.commuteTo) return null;
    const dest = encodeURIComponent(city.commuteTo);
    const origin = city.commuteFrom ? encodeURIComponent(city.commuteFrom) : "";
    return `https://www.google.com/maps/dir/?api=1&destination=${dest}${origin ? "&origin="+origin : ""}`;
  }

  function render(){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    CITIES.forEach((city) => {
      const card = document.createElement("div");
      card.className = "card" + (city.isHQ ? " hq" : "");
      card.innerHTML = `
        <div class="city-row">
          <div class="city">${city.label}</div>
          ${city.isHQ ? '<div class="tag">HQ</div>' : ""}
        </div>
        <div class="loading">Loading forecast…</div>
      `;
      grid.appendChild(card);

      loadCity(city).then(current => {
        const [icon, label] = WCODE[current.weather_code] || ["🌡️","—"];
        const link = commuteUrl(city);
        card.innerHTML = `
          <div class="city-row">
            <div class="city">${city.label}</div>
            ${city.isHQ ? '<div class="tag">HQ</div>' : ""}
          </div>
          <div class="temp-row">
            <div class="icon">${icon}</div>
            <div>
              <div class="temp">${Math.round(current.temperature_2m)}°C</div>
              <div class="cond">${label}</div>
            </div>
          </div>
          <div class="meta">Feels like ${Math.round(current.apparent_temperature)}° · Wind ${Math.round(current.wind_speed_10m)} km/h</div>
          ${link ? `<a class="commute-link" href="${link}" target="_blank" rel="noopener">Check traffic →</a>` : ""}
        `;
      }).catch(() => {
        card.innerHTML = `<div class="city-row"><div class="city">${city.label}</div></div><div class="error">Couldn't load weather.</div>`;
      });
    });
    document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }

  render();
  // refresh every 30 minutes
  setInterval(render, 30 * 60 * 1000);
</script>
</body>
</html>
